# Players can't close the menu until they have picked a class
force-choice: true

# Starting kit is only given once, when the class is chosen
classes:
  warrior:
    display-name: '&cWarrior'
    icon: IRON_SWORD
    description:
    - '&7A tough frontline fighter.'
    - '&a+4 hearts'
    health-bonus: 8.0
    items:
    - ==: org.bukkit.inventory.ItemStack
      DataVersion: 5023
      id: minecraft:iron_sword
      count: 1
      schema_version: 1
    - ==: org.bukkit.inventory.ItemStack
      DataVersion: 5023
      id: minecraft:shield
      count: 1
      schema_version: 1
    - ==: org.bukkit.inventory.ItemStack
      DataVersion: 5023
      id: minecraft:cooked_beef
      count: 16
      schema_version: 1
  archer:
    display-name: '&aArcher'
    icon: BOW
    description:
    - '&7Deadly from a distance.'
    health-bonus: 0.0
    items:
    - BOW:1
    - ARROW:48
    - COOKED_CHICKEN:16
  mage:
    display-name: '&bMage'
    icon: BLAZE_ROD
    description:
    - '&7Fragile, but well supplied.'
    - '&c-2 hearts'
    health-bonus: -4.0
    items:
    - ==: org.bukkit.inventory.ItemStack
      DataVersion: 5023
      id: minecraft:blaze_rod
      count: 1
      schema_version: 1
    - ==: org.bukkit.inventory.ItemStack
      DataVersion: 5023
      id: minecraft:experience_bottle
      count: 16
      schema_version: 1
    - ==: org.bukkit.inventory.ItemStack
      DataVersion: 5023
      id: minecraft:golden_apple
      count: 2
      schema_version: 1
  miner:
    display-name: '&6Miner'
    icon: IRON_PICKAXE
    description:
    - '&7Digs deep, lives well.'
    health-bonus: 0.0
    items:
    - IRON_PICKAXE:1
    - TORCH:32
    - BREAD:16
  dwarf:
    display-name: '&fDwarf'
    icon: IRON_PICKAXE
    description:
    - '&7New class.'
    health-bonus: 4.0
    items:
    - ==: org.bukkit.inventory.ItemStack
      DataVersion: 5023
      id: minecraft:iron_pickaxe
      count: 1
      components:
        minecraft:repair_cost: '3'
        minecraft:enchantments: '{"minecraft:efficiency":5,"minecraft:unbreaking":3}'
      schema_version: 1
    - ==: org.bukkit.inventory.ItemStack
      DataVersion: 5023
      id: minecraft:bread
      count: 16
      schema_version: 1
