# vision-core configuration
#
# MOTD
#   text      - the line itself. MiniMessage tags work here: <red>, <bold>, <#ff8800>, <gradient:#aaa:#bbb>...
#   gradient  - 2 or more hex colours the line fades through. Empty list [] = no fade.
#   bold      - bold the whole line.
#   center    - pad each line with spaces so it sits in the middle of the server list.
#   center-width - width (in pixels) of the MOTD area in the server list. If your lines look
#                  slightly left/right of centre, nudge this number (vanilla is ~270).
# Hex colours need 1.16+ clients.
motd:
  center: true
  center-width: 270
  line1:
    text: VISION SMP
    gradient:
    - '#89b8d2'
    - '#5F8093'
    bold: true
  line2:
    text: Join our hardcore roleplay server!
    gradient:
    - '#FF9A9E'
    - '#FECF6B'
    bold: false

# HEARTS (1 heart = 2 health points)
#   Every player's hearts are saved in plugins/vision-core/hearts.yml - don't edit that file while the server runs.
#   default  - hearts every player starts with (vanilla = 10)
#   min      - lowest a player can drop to (/takeheart cannot go below this)
#   max      - highest a player can reach by redeeming Extra Hearts
#   reward-on-kill - the killer of a player receives an Extra Heart item
#   victim-loses-heart-on-kill - the player who got killed loses one heart (never below min)
#   drop-confirm-seconds - dropping an Extra Heart needs a second drop within this many seconds (0 = off)
#   item.tooltip-style   - tooltip frame/background of the Extra Heart from your resource pack ("namespace:name", empty = vanilla)
# The Extra Heart is a nether star tagged internally, so renamed/normal nether stars do nothing.
hearts:
  default: 10
  min: 1
  max: 20
  reward-on-kill: true
  victim-loses-heart-on-kill: false
  drop-confirm-seconds: 3
  item:
    rarity: '&d&lMYTHIC'
    name: '&4&lExtra Heart'
    lore:
    - '&7Right-click to gain an extra heart.'
    tooltip-style: vision:mythic

# ECONOMY / CURRENCIES
#   default-currency - the currency used when a command doesn't name one
#   currencies       - every currency on the server. To add one: copy a block, give it a new id
#                      (lowercase letters, numbers, _ or -) and run /vc reload. No restart needed.
#   Per currency:
#     name / singular  - plural / singular display name ("1 Gold Coin", "5 Gold Coins")
#     color            - colour code for the amount, e.g. "&6" (gold) or "&b" (aqua)
#     starting-balance - what a player gets the first time they join
#     payable          - whether players can send it to each other with /pay
#     max-balance      - highest balance a player can hold (0 = no limit)
#   Balances are saved in plugins/vision-core/balances.yml - don't edit it while the server runs.
#   Note: the gold_coins block is restored on startup if you delete it.
economy:
  default-currency: gold_coins
  currencies:
    gold_coins:
      name: Gold Coins
      singular: Gold Coin
      color: '&6'
      starting-balance: 0
      payable: true
      max-balance: 0
    coin_stack:
      name: Coin Stacks
      singular: Coin Stack
      color: '&e'
      starting-balance: 0
      payable: true
      max-balance: 0
# Example of a second currency (remove the # signs, then /vc reload):
# gems:
#   name: "Gems"
#   singular: "Gem"
#   color: "&b"
#   starting-balance: 0
#   payable: false

# TABLIST
#   header / footer  - lines shown above / below the player list (MiniMessage: <gradient:#aaa:#bbb>, <red>, ...).
#                      Put your logo in the header. With a resource pack you can use a custom font glyph:
#                      "<font:yourpack:logo>A</font>"
#   update-interval-seconds - how often the tablist refreshes (ping, online count, balance...)
#   sort-by-rank     - sort players by rank (first rank under 'ranks' on top), otherwise alphabetical
#   ranks            - highest rank FIRST. A player gets the first rank whose permission they have.
#                      With LuckPerms, a group called 'admin' gives the node 'group.admin' automatically.
#                      Careful: players with the '*' permission match every rank, so they get the first one.
#     name           - plain rank name, available as <rank>
#     permission     - permission node to have this rank
#     format         - how the player is shown in the list, <player> = their name
#   default-rank     - used when a player has none of the permissions above
#   Placeholders (header, footer and formats):
#     <player> <rank> <ping> <hearts> <world> <online> <max> <tps>
#     <balance> / <currency>  - balance and name of the default currency
#     <bal_ID>                - balance of a specific currency, e.g. <bal_gold_coins>
tablist:
  enabled: true
  update-interval-seconds: 2
  sort-by-rank: true
  header:
  - ''
  - 
  - ''
  - ''
  - ''
  - ''
  - ''
  footer:
  - ''
  - '<gray>Players online: <white><online><dark_gray>/<white><max>'
  - '<gray>: <red><hearts> <gray>: <gold><balance> <gray>: <gold><bal_coin_stack>'
  - ''
  - <aqua>store.minecraft.vision
  - ''
  default-rank:
    name: Player
    format: <gray><player>
  ranks:
    owner:
      name: Owner
      permission: group.owner
      format: <white></white> <white><player>
    admin:
      name: Admin
      permission: group.admin
      format: <white></white> <white><player>
    developer:
      name: Developer
      permission: group.developer
      format: <white></white> <white><player>
    mod:
      name: Mod
      permission: group.mod
      format: <white></white> <white><player>
    helper:
      name: Helper
      permission: group.helper
      format: <white></white> <white><player>
    builder:
      name: Builder
      permission: group.builder
      format: <white></white> <white><player>
    vip:
      name: VIP
      permission: group.vip
      format: <white></white> <white><player>
    vip+:
      name: VIP+
      permission: group.vip_plus
      format: <white></white> <white><player>
    member:
      name: Member
      permission: group.member
      format: "<white>\uE100</white> <white><player>"

# PERSONAL LOOT
#   Every player gets their own copy of the loot in generated chests (villages, shipwrecks, buried treasure,
#   dungeons, mineshaft minecarts...). One player emptying a chest never affects anyone else, and what a
#   player leaves behind stays in their own copy.
#   minecarts       - chest minecarts (abandoned mineshafts) are personal too
#   protect-chests  - nobody can break (or blow up) a loot chest, because that would destroy it for everyone.
#                     Players with the permission visioncore.loot.break (ops by default) can still break them.
#   disabled-worlds - worlds where chests keep the normal shared vanilla behaviour
#   Saved per player in plugins/vision-core/loot/. '/vc loot reset <player|all>' makes the chests fresh again.
loot:
  enabled: true
  minecarts: true
  protect-chests: true
  disabled-worlds: []

# Spawn is written here by /setspawn (spawn: world, x, y, z, yaw, pitch)

settings:
  # Teleport players who join for the very first time to the spawn
  teleport-on-first-join: true
  # Respawn at the spawn when the player has no bed / respawn anchor
  respawn-at-spawn: true

