name: VisionParkour
version: '${version}'
main: nl.codebyvision.parkour.VisionParkour
api-version: '1.21'
author: Code by Vision
description: '${description}'
softdepend: [Multiverse-Core]

commands:
  parkour:
    description: Parkours spelen en beheren.
    usage: /parkour checkpoint|leave|top <naam>|list
    aliases: [pk, jump]

permissions:
  parkour.admin:
    description: Parkours aanmaken, aanpassen en verwijderen.
    default: op
